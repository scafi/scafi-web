name: ScafiWeb frontend deploy

on: [push, workflow_dispatch]
jobs:
  Build:
    strategy:
      matrix:
        os: [ ubuntu-20.04 ]
        jvm_version: [ 11 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3.0.2
      - name: Setup Scala with Java ${{ matrix.jvm_version }}
        uses: olafurpg/setup-scala@v11
        with:
          java-version: adopt@1.${{ matrix.java }}
      - name: Coursier cache
        uses: coursier/cache-action@v5
      - name: Sbt test
        run: sbt test
  Deploy:
    runs-on: ubuntu-latest
    needs: [Build]
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v3.0.2
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Fetch tags
        run: git fetch --tags -f
      - name: Setup Scala
        uses: olafurpg/setup-scala@v11
      - name: Coursier cache
        uses: coursier/cache-action@v5
      - name: Build frontend with SBT
        run: sbt -v "project frontend; fullOptJS::webpack"
      - name: Adjust folders for deployment
        run: .github/scripts/adjust-deployment.sh
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: scafi/web 
          publish_dir: ./public
